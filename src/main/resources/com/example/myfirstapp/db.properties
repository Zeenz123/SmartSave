# Database Configuration
# PRIMARY: MySQL via JDBC. Create/start a local MySQL server, then set your password below.
# The "smartsave" database and all tables are created automatically on first run.
# If the MySQL server is unreachable the app falls back to embedded SQLite (smartsave.db).
# Override at runtime without editing this file:  -Dsmartsave.db.url=...  or env vars below.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/smartsave?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root
